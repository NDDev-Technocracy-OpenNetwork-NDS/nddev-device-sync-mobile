name: native

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read


env:
  CARGO_BUILD_JOBS: 4
  GH_TOKEN: ${{ github.token }}

jobs:
  source:
    runs-on: ubuntu-26.04
    outputs:
      desktop: ${{ steps.desktop.outputs.sha }}
      rust: ${{ steps.pins.outputs.rust }}
      renderer_python: ${{ steps.pins.outputs.renderer_python }}
    steps:
      - name: Prepare immutable source resolution
        id: prepare
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@b21b5e0745bf21caaaa71a64560a7135b92a903f # v0.6.82
        with:
          python-version: '3.15.2'
      - id: desktop
        run: python scripts/desktop-source.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-desktop
          ref: ${{ steps.desktop.outputs.sha }}
          path: vendor/desktop
          persist-credentials: false
      - name: Resolve the selected Shared compiler and canonical renderer
        id: pins
        run: |
          python - <<'PYPINS'
          import json,os,re,tomllib
          from pathlib import Path
          rust=tomllib.loads(Path('vendor/desktop/packages/nds_native/rust/rust-toolchain.toml').read_text())['toolchain']['channel']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',rust): raise SystemExit('Expected an exact selected Shared compiler')
          renderer=json.loads(Path('generated/launcher-provenance.json').read_text())['source']['renderer']
          renderer_python=renderer['python']
          if renderer.get('platform')!='Linux-x86_64' or not isinstance(renderer_python,str) or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',renderer_python): raise SystemExit('Expected an exact canonical Linux renderer interpreter')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('rust='+rust+'\n')
              output.write('renderer_python='+renderer_python+'\n')
          PYPINS
      - name: Complete source resolution
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@b21b5e0745bf21caaaa71a64560a7135b92a903f # v0.6.82
        with:
          status: ${{ job.status }}
          project-outcome: ${{ steps.prepare.outcome == 'failure' && 'success' || job.status }}
          task: mobile-source
          name: mobile-source
          read-token: ${{ steps.prepare.outputs.read-token }}

  builds:
    needs: [source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: android
            rust_targets: aarch64-linux-android,x86_64-linux-android
          # The simulator and device builds compile separate native targets;
          # parallel jobs keep the slower one on the critical path alone.
          - os: macos-15
            target: ios-simulator
            rust_targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
          - os: macos-15
            target: ios-device
            rust_targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Prepare Android execution
        if: matrix.target == 'android'
        id: prepare_android
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@b21b5e0745bf21caaaa71a64560a7135b92a903f # v0.6.82
        with:
          python-version: ${{ needs.source.outputs.renderer_python }}
          rust-version: ${{ needs.source.outputs.rust }}
          rust-components: clippy
          rust-targets: ${{ matrix.rust_targets }}
          java-version: '25.0.4.1+1'
      - name: Prepare Apple execution
        if: matrix.target != 'android'
        id: prepare_apple
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/prepare@b21b5e0745bf21caaaa71a64560a7135b92a903f # v0.6.82
        with:
          python-version: '3.15.2'
          rust-version: ${{ needs.source.outputs.rust }}
          rust-components: clippy
          rust-targets: ${{ matrix.rust_targets }}
      - id: design
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          sha=json.loads(Path('generated/launcher-provenance.json').read_text())['source']['commit']
          assert re.fullmatch('[a-f0-9]{40}',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+sha+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system
          ref: ${{ steps.design.outputs.sha }}
          path: vendor/design-system
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: python -m pip install --require-hashes -r vendor/design-system/tools/requirements-icons.txt
      - if: runner.os == 'Linux'
        run: bash vendor/design-system/tools/with-renderer-zlib.sh python vendor/design-system/tools/generate_launchers.py --mobile . --check
      - run: python -S vendor/design-system/tools/generate_launchers.py --mobile . --verify
      - id: desktop
        run: python scripts/desktop-source.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-desktop
          ref: ${{ steps.desktop.outputs.sha }}
          path: vendor/desktop
          persist-credentials: false
      # Flutter is the exact archive owned by the immutable Shared source, not a second version selection.
      - run: python vendor/desktop/scripts/bootstrap-ci.py
      - name: Native Android toolchain
        if: matrix.target == 'android'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          flutter config --android-sdk "$ANDROID_HOME" --jdk-dir "$JAVA_HOME"
      - run: just setup
      - run: just check
      - name: Native Android compilation and lints
        if: matrix.target == 'android'
        shell: bash
        run: |
          export CC_aarch64_linux_android="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export CC_x86_64_linux_android="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
          export AR_aarch64_linux_android="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export AR_x86_64_linux_android="$AR_aarch64_linux_android"
          python vendor/desktop/packages/nds_native/tool/prepare_native.py -- cargo clippy --manifest-path vendor/desktop/packages/nds_native/rust/Cargo.toml --locked --all-targets --target aarch64-linux-android -- -D warnings
          python vendor/desktop/packages/nds_native/tool/prepare_native.py -- cargo clippy --manifest-path vendor/desktop/packages/nds_native/rust/Cargo.toml --locked --all-targets --target x86_64-linux-android -- -D warnings
      - name: Android ARM64 app
        if: matrix.target == 'android'
        run: python vendor/desktop/scripts/build.py apk --debug --target-platform android-arm64
      - name: Android artifact boundary
        if: matrix.target == 'android'
        env:
          DESKTOP_SOURCE_SHA: ${{ steps.desktop.outputs.sha }}
        run: python vendor/desktop/scripts/check-artifact.py build/app/outputs/flutter-apk/app-debug.apk --native-source-commit "$DESKTOP_SOURCE_SHA"
      - name: Android wrapper/native provenance
        if: matrix.target == 'android'
        run: python vendor/desktop/scripts/build-provenance.py build/app/outputs/flutter-apk/app-debug.apk --output build/nds-android-provenance.json
      - name: iOS simulator build
        if: matrix.target == 'ios-simulator'
        run: python vendor/desktop/scripts/build.py ios --simulator --debug --no-codesign
      - name: iOS simulator artifact boundary
        if: matrix.target == 'ios-simulator'
        env:
          DESKTOP_SOURCE_SHA: ${{ steps.desktop.outputs.sha }}
        run: python vendor/desktop/scripts/check-artifact.py build/ios/iphonesimulator --native-source-commit "$DESKTOP_SOURCE_SHA"
      - name: iOS simulator wrapper/native provenance
        if: matrix.target == 'ios-simulator'
        run: python vendor/desktop/scripts/build-provenance.py build/ios/iphonesimulator --output build/nds-ios-simulator-provenance.json
      - name: Unsigned iOS device build
        if: matrix.target == 'ios-device'
        run: python vendor/desktop/scripts/build.py ios --debug --no-codesign
      - name: iOS device artifact boundary
        if: matrix.target == 'ios-device'
        env:
          DESKTOP_SOURCE_SHA: ${{ steps.desktop.outputs.sha }}
        run: python vendor/desktop/scripts/check-artifact.py build/ios/iphoneos --native-source-commit "$DESKTOP_SOURCE_SHA"
      - name: iOS device wrapper/native provenance
        if: matrix.target == 'ios-device'
        run: python vendor/desktop/scripts/build-provenance.py build/ios/iphoneos --output build/nds-ios-device-provenance.json
      - name: Complete native compilation
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/complete@b21b5e0745bf21caaaa71a64560a7135b92a903f # v0.6.82
        with:
          status: ${{ job.status }}
          project-outcome: ${{ (steps.prepare_android.outcome == 'failure' || steps.prepare_apple.outcome == 'failure') && 'success' || job.status }}
          task: mobile-${{ matrix.target }}
          name: mobile-${{ matrix.target }}
          read-token: ${{ steps.prepare_android.outputs.read-token || steps.prepare_apple.outputs.read-token }}

  quality:
    if: always()
    needs: [source, builds]
    runs-on: ubuntu-26.04
    steps:
      - name: Every declared native target completed
        run: test '${{ needs.source.result }}' = success && test '${{ needs.builds.result }}' = success
      - name: Record the actual aggregate verdict
        if: always()
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/job-record@b21b5e0745bf21caaaa71a64560a7135b92a903f # v0.6.82
        with:
          task: mobile-native-quality
          status: ${{ job.status }}
