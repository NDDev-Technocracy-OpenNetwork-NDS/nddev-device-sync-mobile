name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 4
  GH_TOKEN: ${{ github.token }}

jobs:
  builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: android
          # The simulator and device builds compile separate native targets;
          # parallel jobs keep the slower one on the critical path alone.
          - os: macos-15
            target: ios-simulator
          - os: macos-15
            target: ios-device
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - id: design
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          sha=json.loads(Path('generated/launcher-provenance.json').read_text())['source']['commit']
          assert re.fullmatch('[a-f0-9]{40}',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+sha+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system
          ref: ${{ steps.design.outputs.sha }}
          path: vendor/design-system
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: python -m pip install --require-hashes -r vendor/design-system/tools/requirements-icons.txt
      - if: runner.os == 'Linux'
        run: bash vendor/design-system/tools/with-renderer-zlib.sh python vendor/design-system/tools/generate_launchers.py --mobile . --check
      - run: python -S vendor/design-system/tools/generate_launchers.py --mobile . --verify
      - id: desktop
        run: python scripts/desktop-source.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-desktop
          ref: ${{ steps.desktop.outputs.sha }}
          path: vendor/desktop
          persist-credentials: false
      - run: python vendor/desktop/scripts/bootstrap-ci.py
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Install current LTS Java
        if: matrix.target == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Native Android toolchain
        if: matrix.target == 'android'
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;37.0.0' 'ndk;30.0.16248370'
          rustup target add --toolchain 1.99.1 aarch64-linux-android x86_64-linux-android
          flutter config --android-sdk "$ANDROID_HOME" --jdk-dir "$JAVA_HOME"
      - name: Native iOS targets
        if: startsWith(matrix.target, 'ios')
        run: rustup target add --toolchain 1.99.1 aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Restore the Gradle dependency and build cache
        if: matrix.target == 'android'
        id: gradle-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze --no-pub
      - name: Native Android compilation and lints
        if: matrix.target == 'android'
        shell: bash
        run: |
          export CC_aarch64_linux_android="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export CC_x86_64_linux_android="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android35-clang"
          export AR_aarch64_linux_android="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export AR_x86_64_linux_android="$AR_aarch64_linux_android"
          python vendor/desktop/packages/nds_native/tool/prepare_native.py -- rustup run 1.99.1 cargo clippy --manifest-path vendor/desktop/packages/nds_native/rust/Cargo.toml --locked --all-targets --target aarch64-linux-android -- -D warnings
          python vendor/desktop/packages/nds_native/tool/prepare_native.py -- rustup run 1.99.1 cargo clippy --manifest-path vendor/desktop/packages/nds_native/rust/Cargo.toml --locked --all-targets --target x86_64-linux-android -- -D warnings
      - name: Android ARM64 app
        if: matrix.target == 'android'
        run: python vendor/desktop/scripts/build.py apk --debug --target-platform android-arm64
      - name: Android artifact boundary
        if: matrix.target == 'android'
        run: python vendor/desktop/scripts/check-artifact.py build/app/outputs/flutter-apk/app-debug.apk --native-source-commit ${{ steps.desktop.outputs.sha }}
      - name: Android wrapper/native provenance
        if: matrix.target == 'android'
        run: python vendor/desktop/scripts/build-provenance.py build/app/outputs/flutter-apk/app-debug.apk --output build/nds-android-provenance.json
      - name: Save the Gradle dependency and build cache
        if: matrix.target == 'android' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: iOS simulator build
        if: matrix.target == 'ios-simulator'
        run: python vendor/desktop/scripts/build.py ios --simulator --debug --no-codesign
      - name: iOS simulator artifact boundary
        if: matrix.target == 'ios-simulator'
        run: python vendor/desktop/scripts/check-artifact.py build/ios/iphonesimulator --native-source-commit ${{ steps.desktop.outputs.sha }}
      - name: iOS simulator wrapper/native provenance
        if: matrix.target == 'ios-simulator'
        run: python vendor/desktop/scripts/build-provenance.py build/ios/iphonesimulator --output build/nds-ios-simulator-provenance.json
      - name: Unsigned iOS device build
        if: matrix.target == 'ios-device'
        run: python vendor/desktop/scripts/build.py ios --debug --no-codesign
      - name: iOS device artifact boundary
        if: matrix.target == 'ios-device'
        run: python vendor/desktop/scripts/check-artifact.py build/ios/iphoneos --native-source-commit ${{ steps.desktop.outputs.sha }}
      - name: iOS device wrapper/native provenance
        if: matrix.target == 'ios-device'
        run: python vendor/desktop/scripts/build-provenance.py build/ios/iphoneos --output build/nds-ios-device-provenance.json
  quality:
    if: always()
    needs: [builds]
    runs-on: ubuntu-24.04
    steps:
      - run: test '${{ needs.builds.result }}' = success
