name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.0'
      - id: design
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          sha=json.loads(Path('generated/launcher-provenance.json').read_text())['source']['commit']
          assert re.fullmatch('[a-f0-9]{40}',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+sha+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system
          ref: ${{ steps.design.outputs.sha }}
          path: vendor/design-system
          persist-credentials: false
      - run: python -m pip install --require-hashes -r vendor/design-system/tools/requirements-icons.txt
      - run: bash vendor/design-system/tools/with-renderer-zlib.sh python vendor/design-system/tools/generate_launchers.py --mobile . --check
      - run: python -S vendor/design-system/tools/generate_launchers.py --mobile . --verify
      - id: desktop
        run: python scripts/desktop-source.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-desktop
          ref: ${{ steps.desktop.outputs.sha }}
          path: vendor/desktop
          persist-credentials: false
      - run: python vendor/desktop/scripts/bootstrap-ci.py
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze --no-pub

  workflows:
    # Workflow lint and audit plus the secret scan: new commits on pull requests,
    # the full history on main (STD-0004 library tools, verified prebuilt binaries).
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@c192c6adcf22088abf456635de614d42e8fa3f8d # nddev-cicd-v0.6.20
        with:
          capability: security
      - name: Lint and audit workflows
        run: |
          actionlint
          zizmor --offline --no-progress .github
      - name: Scan new pull request commits, or the full history on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi
