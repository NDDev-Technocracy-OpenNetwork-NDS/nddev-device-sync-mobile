name: NDS checks

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  contracts:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Disable external telemetry
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/telemetry@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.0'
      - id: design
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          sha=json.loads(Path('generated/launcher-provenance.json').read_text())['source']['commit']
          assert re.fullmatch('[a-f0-9]{40}',sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('sha='+sha+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-opennetwork-design-system
          ref: ${{ steps.design.outputs.sha }}
          path: vendor/design-system
          persist-credentials: false
      - run: python -m pip install --require-hashes -r vendor/design-system/tools/requirements-icons.txt
      - run: bash vendor/design-system/tools/with-renderer-zlib.sh python vendor/design-system/tools/generate_launchers.py --mobile . --check
      - run: python -S vendor/design-system/tools/generate_launchers.py --mobile . --verify
      - id: desktop
        run: python scripts/desktop-source.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-desktop
          ref: ${{ steps.desktop.outputs.sha }}
          path: vendor/desktop
          persist-credentials: false
      - run: python vendor/desktop/scripts/bootstrap-ci.py
      - run: flutter pub get --enforce-lockfile
      - name: Check the mobile sources
        uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/recipe@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
        with:
          recipe: check

  workflows:
    permissions:
      contents: read
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
    with:
      hosted-runner: ubuntu-26.04
